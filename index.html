<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#14161a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Guitar Tuner</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="app">
    <header class="top">
      <h1>Guitar Tuner</h1>
      <label class="tuning-select">
        <span>Tuning</span>
        <select id="tuningSelect"></select>
      </label>
    </header>

    <!-- Live tuner readout -->
    <section class="meter" aria-live="polite">
      <div class="mode-row">
        <button id="modeChip" class="chip" type="button">Auto detect</button>
        <span id="freqText" class="freq">-- Hz</span>
      </div>

      <svg id="gauge" viewBox="0 0 300 170" class="gauge" aria-hidden="true">
        <path class="gauge-track" d="M30 150 A120 120 0 0 1 270 150" />
        <path id="gaugeZone" class="gauge-zone" />
        <g id="gaugeTicks"></g>
        <text x="30" y="168" class="gauge-label" text-anchor="middle">-50</text>
        <text x="150" y="20" class="gauge-label" text-anchor="middle">0</text>
        <text x="270" y="168" class="gauge-label" text-anchor="middle">+50</text>
        <g id="needle" class="needle" transform="rotate(0 150 150)">
          <line x1="150" y1="150" x2="150" y2="42" />
          <circle cx="150" cy="150" r="8" />
        </g>
      </svg>

      <div id="listenLabel" class="listen-label">Listening to any string</div>
      <div class="target">
        <div id="targetNote" class="target-note">E<small>2</small></div>
        <div id="centsText" class="cents">&nbsp;</div>
      </div>
      <div id="status" class="status">Tap “Start listening” and pluck a string</div>

      <button id="micButton" class="mic-btn" type="button">🎤 Start listening</button>
    </section>

    <!-- Headstock with tappable tuning knobs -->
    <section class="headstock-wrap">
      <p class="hint">Tap a knob to tune just that string.<br>Tap it again to change its note.</p>
      <svg id="headstock" viewBox="0 0 320 380" class="headstock" role="group" aria-label="Guitar headstock"></svg>
      <div class="actions">
        <button id="editNote" type="button" class="ghost">✏️ Change note</button>
        <button id="saveTuning" type="button" class="ghost">Save as custom tuning</button>
        <button id="deleteTuning" type="button" class="ghost danger" hidden>Delete custom tuning</button>
      </div>
    </section>
  </main>

  <!-- Note picker sheet -->
  <div id="sheet" class="sheet" hidden>
    <div class="sheet-backdrop" data-close></div>
    <div class="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
      <div class="sheet-grip"></div>
      <h2 id="sheetTitle">String 6</h2>

      <div class="stepper">
        <button id="semiDown" type="button" aria-label="Down a half step">−</button>
        <div id="pickNote" class="pick-note">E<small>2</small></div>
        <button id="semiUp" type="button" aria-label="Up a half step">+</button>
      </div>
      <div id="pickFreq" class="pick-freq">82.41 Hz</div>

      <div id="noteGrid" class="note-grid"></div>

      <div class="octave-row">
        <button id="octDown" type="button">Octave −</button>
        <button id="octUp" type="button">Octave +</button>
      </div>

      <div class="sheet-actions">
        <button id="playRef" type="button" class="ghost">🔊 Play note</button>
        <button id="sheetDone" type="button" class="primary" data-close>Done</button>
      </div>
    </div>
  </div>

  <script src="js/notes.js"></script>
  <script src="js/pitch.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
